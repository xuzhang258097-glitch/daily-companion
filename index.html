<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每日陪伴">
  <meta name="description" content="你的全天候陪伴助手 — 晨间知识、待办追踪、晚间复盘">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Daily Companion · 每日陪伴</title>
  <link rel="manifest" href="manifest.json?v=9">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- 动态渐变背景 -->
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- 顶部状态栏 -->
  <header class="top-bar glass">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">Daily Companion</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn mobile-only" id="btnMenu" title="菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <button class="icon-btn" id="soundToggle" title="音效开关">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="主题切换">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-container">
    <!-- 左侧：时间轴与任务面板 -->
    <aside class="side-panel glass" id="sidePanel">
      <div class="panel-header">
        <h3>今日时光轴</h3>
        <span class="live-time" id="liveTime">--:--</span>
      </div>
      
      <div class="timeline">
        <div class="timeline-item" data-hour="9">
          <div class="timeline-dot" id="dot9"></div>
          <div class="timeline-content">
            <span class="time-label">09:00</span>
            <span class="task-label">晨间知识</span>
            <span class="status" id="status9">待开始</span>
          </div>
        </div>
        <div class="timeline-item" data-hour="9" data-sub>
          <div class="timeline-dot small" id="dot9sub"></div>
          <div class="timeline-content">
            <span class="time-label">09:10</span>
            <span class="task-label">待办登记</span>
            <span class="status" id="status9sub">待开始</span>
          </div>
        </div>
        <div class="timeline-item" data-hour="18">
          <div class="timeline-dot" id="dot18"></div>
          <div class="timeline-content">
            <span class="time-label">18:00</span>
            <span class="task-label">晚间复盘</span>
            <span class="status" id="status18">待开始</span>
          </div>
        </div>
      </div>

      <div class="panel-divider"></div>

      <div class="panel-header">
        <h3>我的待办</h3>
        <span class="badge" id="todoCount">0</span>
      </div>
      <div class="todo-list" id="todoList">
        <div class="empty-state">暂无待办事项</div>
      </div>
      <button class="btn-add-todo" id="btnAddTodo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        添加待办
      </button>

      <div class="panel-divider"></div>

      <div class="panel-header">
        <h3>📚 每日阅读</h3>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span class="badge" id="storyWeekBadge" style="background: var(--c-accent); color: white;">入门周</span>
          <span class="badge" id="storyCount">0</span>
        </div>
      </div>
      <div class="story-list" id="storyList">
        <div class="empty-state">今日故事加载中...</div>
      </div>
      <button class="btn-add-todo" id="btnOpenReading" style="margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        开始阅读
      </button>
    </aside>

    <!-- 移动端侧边栏遮罩 -->
    <div class="side-panel-overlay" id="sidePanelOverlay"></div>

    <!-- 右侧：聊天区域 -->
    <section class="chat-area">
      <div class="chat-header glass">
        <div class="companion-avatar">
          <div class="avatar-ring"></div>
          <span>🌙</span>
        </div>
        <div class="companion-info">
          <h2>小咪</h2>
          <p class="companion-status" id="companionStatus">
            <span class="status-dot online"></span>
            在线陪伴中
          </p>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" id="btnReview" title="查看复盘">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- 欢迎消息由 JS 动态生成 -->
      </div>

      <div class="chat-input-area glass">
        <div class="input-wrapper">
          <input type="text" id="chatInput" placeholder="和小咪聊聊天吧..." autocomplete="off">
          <button class="btn-send" id="btnSend">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="quick-replies" id="quickReplies"></div>
      </div>
    </section>
  </main>

  <!-- 待办添加弹窗 -->
  <div class="modal-overlay" id="todoModal">
    <div class="modal glass">
      <div class="modal-header">
        <h3>添加待办事项</h3>
        <button class="btn-close" id="btnCloseTodo">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="todoInput" placeholder="输入待办事项..." class="modal-input">
        <div class="priority-selector">
          <label>优先级：</label>
          <button class="priority-btn active" data-p="normal">普通</button>
          <button class="priority-btn" data-p="important">重要</button>
          <button class="priority-btn" data-p="urgent">紧急</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btnCancelTodo">取消</button>
        <button class="btn-primary" id="btnConfirmTodo">确认添加</button>
      </div>
    </div>
  </div>

  <!-- 复盘弹窗 -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal modal-large glass">
      <div class="modal-header">
        <h3>📋 成长复盘中心</h3>
        <button class="btn-close" id="btnCloseReview">&times;</button>
      </div>
      <div class="modal-body">
        <div class="review-tabs">
          <button class="review-tab active" data-tab="today">今日复盘</button>
          <button class="review-tab" data-tab="week">本周回顾</button>
          <button class="review-tab" data-tab="history">历史记录</button>
        </div>
        <div class="review-content" id="reviewContent">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 英文阅读面板 -->
  <div class="modal-overlay" id="readingModal">
    <div class="modal modal-reading glass">
      <div class="modal-header">
        <h3>📚 每日趣味英文阅读</h3>
        <button class="btn-close" id="btnCloseReading">&times;</button>
      </div>
      <div class="modal-body reading-body">
        <!-- 故事列表视图 -->
        <div class="reading-story-list" id="readingStoryList">
          <div class="reading-intro">
            <p>每天阅读英文小故事，积累词汇、培养语感 ✨</p>
            <p class="reading-tip">点击任意单词即可查看释义和发音</p>
          </div>
          <div class="reading-stories-grid" id="readingStoriesGrid">
            <!-- 动态填充 -->
          </div>
        </div>
        <!-- 故事阅读视图 -->
        <div class="reading-story-view" id="readingStoryView" style="display: none;">
          <button class="btn-back" id="btnBackToList">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回列表
          </button>
          <div class="story-meta" id="storyMeta"></div>

          <!-- 查看翻译按钮 -->
          <button class="btn-toggle-translation" id="btnToggleTranslation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            查看翻译
          </button>

          <div class="story-content" id="storyContent"></div>

          <!-- 中文翻译区域（默认隐藏） -->
          <div class="story-translation" id="storyTranslation" style="display: none;">
            <div class="translation-header">
              <span>📖 参考译文</span>
              <button class="btn-hide-translation" id="btnHideTranslation">收起</button>
            </div>
            <div class="translation-body" id="translationBody"></div>
          </div>

          <!-- 底部操作按钮组 -->
          <div class="story-actions" id="storyActions">
            <button class="story-action-btn btn-done" id="btnStoryDone">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              读完
            </button>
            <button class="story-action-btn btn-mastered" id="btnStoryMastered">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
              </svg>
              掌握
            </button>
            <button class="story-action-btn btn-review" id="btnStoryReview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 4v6h6"></path>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
              明日再来一遍
            </button>
          </div>

          <div class="story-progress">
            <div class="progress-bar">
              <div class="progress-fill" id="storyProgressFill"></div>
            </div>
            <span class="progress-text" id="storyProgressText">阅读进度 0%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 单词查词浮动卡片 -->
  <div class="word-tooltip" id="wordTooltip">
    <div class="word-tooltip-header">
      <span class="word-text" id="tooltipWord"></span>
      <button class="word-speaker" id="tooltipSpeaker" title="点击发音">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>
    <div class="word-phonetic" id="tooltipPhonetic"></div>
    <div class="word-meaning" id="tooltipMeaning"></div>
  </div>

  <!-- 通知 Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="stories.js?v=9"></script>
  <script src="knowledge.js?v=9"></script>
  <script src="sound.js?v=9"></script>
  <script src="app.js?v=9"></script>
  <script>
    // 注册 Service Worker，支持 PWA 离线访问
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then((reg) => console.log('SW 注册成功:', reg.scope))
          .catch((err) => console.log('SW 注册失败:', err));
      });
    }
  </script>
</body>
</html>
